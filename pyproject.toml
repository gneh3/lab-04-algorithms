[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-4-algorithms"
version = "0.1.0"
description = "Лабораторная работа №4: алгоритмический мини-пакет"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pre-commit>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "benchmark",
    "consts",
    "fibonacci",
    "generators",
    "linked_list",
    "main",
    "queue",
    "sort",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
